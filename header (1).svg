<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* particle float animations */
    @keyframes f1 { 0%{transform:translate(0,0)} 25%{transform:translate(12px,-18px)} 50%{transform:translate(-8px,14px)} 75%{transform:translate(16px,6px)} 100%{transform:translate(0,0)} }
    @keyframes f2 { 0%{transform:translate(0,0)} 33%{transform:translate(-14px,10px)} 66%{transform:translate(10px,-12px)} 100%{transform:translate(0,0)} }
    @keyframes f3 { 0%{transform:translate(0,0)} 40%{transform:translate(8px,16px)} 80%{transform:translate(-12px,-8px)} 100%{transform:translate(0,0)} }
    @keyframes f4 { 0%{transform:translate(0,0)} 30%{transform:translate(-16px,-10px)} 70%{transform:translate(6px,18px)} 100%{transform:translate(0,0)} }
    @keyframes f5 { 0%{transform:translate(0,0)} 20%{transform:translate(14px,8px)} 60%{transform:translate(-10px,-14px)} 100%{transform:translate(0,0)} }

    .p1{animation:f1 9s ease-in-out infinite;}
    .p2{animation:f2 11s ease-in-out infinite;}
    .p3{animation:f3 8s ease-in-out infinite;}
    .p4{animation:f4 13s ease-in-out infinite;}
    .p5{animation:f5 10s ease-in-out infinite;}
    .p6{animation:f1 12s ease-in-out infinite reverse;}
    .p7{animation:f2 7s ease-in-out infinite reverse;}
    .p8{animation:f3 14s ease-in-out infinite reverse;}
    .p9{animation:f4 9s ease-in-out 2s infinite;}
    .p10{animation:f5 11s ease-in-out 1s infinite;}
    .p11{animation:f1 8s ease-in-out 3s infinite reverse;}
    .p12{animation:f2 10s ease-in-out 1.5s infinite;}
    .p13{animation:f3 12s ease-in-out 0.5s infinite reverse;}
    .p14{animation:f4 7s ease-in-out 2.5s infinite;}
    .p15{animation:f5 9s ease-in-out 1s infinite reverse;}
    .p16{animation:f1 11s ease-in-out 3.5s infinite;}
    .p17{animation:f2 13s ease-in-out 0.8s infinite reverse;}
    .p18{animation:f3 8s ease-in-out 2s infinite;}

    .name { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 48px; font-weight: 700; fill: #ffffff; animation: fadeUp 0.8s ease 0.2s both; }
    .sub  { font-family: 'Courier New', monospace; font-size: 12px; fill: #cccccc; animation: fadeUp 0.8s ease 0.5s both; }

    /* typewriter: 4 phrases cycling */
    .tw { font-family: 'Courier New', monospace; font-size: 13px; fill: #E8611A; }
    .cur { font-family: 'Courier New', monospace; font-size: 13px; fill: #E8611A; animation: blink 1s step-end infinite; }

    .ph1 { animation: ph1anim 24s linear infinite; }
    .ph2 { animation: ph2anim 24s linear infinite; }
    .ph3 { animation: ph3anim 24s linear infinite; }
    .ph4 { animation: ph4anim 24s linear infinite; }

    /* each phrase: 6s slot. type 2s, hold 2s, delete 2s */
    @keyframes ph1anim {
      0%   { opacity:1; clip-path:inset(0 100% 0 0); }
      8%   { opacity:1; clip-path:inset(0 0% 0 0); }
      17%  { opacity:1; clip-path:inset(0 0% 0 0); }
      25%  { opacity:0; clip-path:inset(0 100% 0 0); }
      100% { opacity:0; clip-path:inset(0 100% 0 0); }
    }
    @keyframes ph2anim {
      0%   { opacity:0; clip-path:inset(0 100% 0 0); }
      25%  { opacity:0; clip-path:inset(0 100% 0 0); }
      33%  { opacity:1; clip-path:inset(0 100% 0 0); }
      41%  { opacity:1; clip-path:inset(0 0% 0 0); }
      50%  { opacity:1; clip-path:inset(0 0% 0 0); }
      58%  { opacity:0; clip-path:inset(0 100% 0 0); }
      100% { opacity:0; clip-path:inset(0 100% 0 0); }
    }
    @keyframes ph3anim {
      0%   { opacity:0; clip-path:inset(0 100% 0 0); }
      50%  { opacity:0; clip-path:inset(0 100% 0 0); }
      58%  { opacity:1; clip-path:inset(0 100% 0 0); }
      66%  { opacity:1; clip-path:inset(0 0% 0 0); }
      75%  { opacity:1; clip-path:inset(0 0% 0 0); }
      83%  { opacity:0; clip-path:inset(0 100% 0 0); }
      100% { opacity:0; clip-path:inset(0 100% 0 0); }
    }
    @keyframes ph4anim {
      0%   { opacity:0; clip-path:inset(0 100% 0 0); }
      75%  { opacity:0; clip-path:inset(0 100% 0 0); }
      83%  { opacity:1; clip-path:inset(0 100% 0 0); }
      91%  { opacity:1; clip-path:inset(0 0% 0 0); }
      96%  { opacity:1; clip-path:inset(0 0% 0 0); }
      100% { opacity:0; clip-path:inset(0 100% 0 0); }
    }
  </style>

  <!-- gradient background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
  <!-- orange glow behind name -->
  <radialGradient id="glow" cx="50%" cy="45%" r="35%">
    <stop offset="0%" stop-color="#E8611A" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#E8611A" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- background -->
<rect width="800" height="280" fill="url(#bg)"/>
<rect width="800" height="280" fill="url(#glow)"/>

<!-- top orange accent line -->
<rect width="800" height="3" fill="#E8611A" opacity="0.9"/>
<!-- bottom orange accent line -->
<rect y="277" width="800" height="3" fill="#E8611A" opacity="0.9"/>

<!-- PARTICLES — orange dots floating -->
<circle class="p1"  cx="42"  cy="28"  r="1.5" fill="#E8611A" opacity="0.5"/>
<circle class="p2"  cx="120" cy="55"  r="1"   fill="#E8611A" opacity="0.35"/>
<circle class="p3"  cx="200" cy="22"  r="2"   fill="#E8611A" opacity="0.4"/>
<circle class="p4"  cx="310" cy="48"  r="1.2" fill="#E8611A" opacity="0.3"/>
<circle class="p5"  cx="420" cy="18"  r="1.8" fill="#E8611A" opacity="0.45"/>
<circle class="p6"  cx="530" cy="42"  r="1"   fill="#E8611A" opacity="0.35"/>
<circle class="p7"  cx="640" cy="25"  r="1.5" fill="#E8611A" opacity="0.5"/>
<circle class="p8"  cx="740" cy="50"  r="1.2" fill="#E8611A" opacity="0.3"/>
<circle class="p9"  cx="70"  cy="220" r="1.8" fill="#E8611A" opacity="0.4"/>
<circle class="p10" cx="160" cy="245" r="1"   fill="#E8611A" opacity="0.3"/>
<circle class="p11" cx="270" cy="230" r="1.5" fill="#E8611A" opacity="0.45"/>
<circle class="p12" cx="380" cy="255" r="1.2" fill="#E8611A" opacity="0.35"/>
<circle class="p13" cx="490" cy="235" r="2"   fill="#E8611A" opacity="0.4"/>
<circle class="p14" cx="590" cy="250" r="1"   fill="#E8611A" opacity="0.3"/>
<circle class="p15" cx="690" cy="225" r="1.5" fill="#E8611A" opacity="0.5"/>
<circle class="p16" cx="760" cy="245" r="1.2" fill="#E8611A" opacity="0.35"/>
<circle class="p17" cx="25"  cy="140" r="1"   fill="#E8611A" opacity="0.3"/>
<circle class="p18" cx="775" cy="130" r="1.5" fill="#E8611A" opacity="0.4"/>

<!-- connector lines between some particles (static, faint) -->
<line x1="42" y1="28" x2="120" y2="55" stroke="#E8611A" stroke-width="0.4" opacity="0.12"/>
<line x1="200" y1="22" x2="310" y2="48" stroke="#E8611A" stroke-width="0.4" opacity="0.10"/>
<line x1="420" y1="18" x2="530" y2="42" stroke="#E8611A" stroke-width="0.4" opacity="0.12"/>
<line x1="640" y1="25" x2="740" y2="50" stroke="#E8611A" stroke-width="0.4" opacity="0.10"/>
<line x1="70" y1="220" x2="160" y2="245" stroke="#E8611A" stroke-width="0.4" opacity="0.12"/>
<line x1="380" y1="255" x2="490" y2="235" stroke="#E8611A" stroke-width="0.4" opacity="0.10"/>
<line x1="590" y1="250" x2="690" y2="225" stroke="#E8611A" stroke-width="0.4" opacity="0.12"/>

<!-- NAME — centered, y=115 -->
<text class="name" x="400" y="118" text-anchor="middle">Imtiaz.</text>

<!-- ORANGE DOT accent -->
<circle cx="508" cy="96" r="5" fill="#E8611A" opacity="0.0"/>

<!-- SUBTITLE — centered, y=150 -->
<text class="sub" x="400" y="152" text-anchor="middle">statistics  →  data  →  responsible ai  →  building</text>

<!-- DIVIDER LINE -->
<line x1="200" y1="168" x2="600" y2="168" stroke="#E8611A" stroke-width="0.5" opacity="0.3"/>

<!-- TYPEWRITER PHRASES — centered, y=200, all in same position, one at a time -->
<text class="tw ph1" x="400" y="200" text-anchor="middle">still the same curiosity, different tools_</text>
<text class="tw ph2" x="400" y="200" text-anchor="middle">from advising AI to actually building it_</text>
<text class="tw ph3" x="400" y="200" text-anchor="middle">research gave the questions, code answers them_</text>
<text class="tw ph4" x="400" y="200" text-anchor="middle">stats → data → ethics → engineering_</text>

<!-- BOTTOM LABEL -->
<text font-family="'Courier New', monospace" font-size="10" fill="#E8611A" opacity="0.5" x="400" y="250" text-anchor="middle">imtiazx.ai</text>
</svg>
